---
# tasks file for linux_baseline
- name: Validate supported operating system
  ansible.builtin.assert:
    that:
      - ansible_os_family in ["Debian", "RedHat"]
    fail_msg: "This role supports Debian-family and RedHat-family systems only."

- name: Install baseline packages
  ansible.builtin.package:
    name: "{{ baseline_packages }}"
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ baseline_timezone }}"

- name: Ensure operations group exists
  ansible.builtin.group:
    name: "{{ baseline_ops_group }}"
    state: present
  when: baseline_create_ops_group

- name: Ensure chrony is enabled and running
  ansible.builtin.service:
    name: "{{ 'chronyd' if ansible_os_family == 'RedHat' else 'chrony' }}"
    enabled: true
    state: started

- name: Manage SSH daemon baseline only when explicitly enabled
  ansible.builtin.template:
    src: 00-ansible-baseline.conf.j2
    dest: /etc/ssh/sshd_config.d/00-ansible-baseline.conf
    owner: root
    group: root
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Validate and reload sshd
  when: baseline_manage_sshd | bool

